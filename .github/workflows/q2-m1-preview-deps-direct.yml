name: Q2 M1 preview dependency verification
on:
  push:
    branches: [research/q2-m1-preview-deps-direct]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q2-m1-preview-deps-direct-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  rust-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify checkout
        run: |
          git rev-parse HEAD
          cat rust-toolchain.toml
      - uses: endersonmenezes/free-disk-space@7901478139cff6e9d44df5972fd8ab8fcade4db1
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-28
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: q2-m1-preview-deps-direct
          cache-on-failure: true
      - name: Check transitive deps and fail-open regressions
        run: cargo test -p quarto-preview --lib project_mode -- --nocapture
      - name: Exercise project dependency endpoint over HTTP
        run: cargo test -p quarto-preview --test integration boot::project_deps_http_endpoint_includes_nested_children -- --nocapture

  spa-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Test SPA dependency filters, request races, and file membership
        run: npm run test --workspace=q2-preview-spa -- src/shouldRerenderForTextChange.test.ts src/PreviewApp.integration.test.tsx
      - name: Typecheck preview SPA
        run: npm run typecheck --workspace=q2-preview-spa

  browser-transitive-e2e:
    name: Chromium real-preview nested include E2E
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free ephemeral runner disk
        uses: endersonmenezes/free-disk-space@7901478139cff6e9d44df5972fd8ab8fcade4db1
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
      - name: Install native and WASM prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libc6-dev gcc-multilib minisign
          curl --fail --location --retry 3 -o tree-sitter.gz https://github.com/tree-sitter/tree-sitter/releases/download/v0.25.8/tree-sitter-linux-x86.gz
          gunzip tree-sitter.gz
          sudo install -m 0755 tree-sitter /usr/local/bin/tree-sitter
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-28
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: q2-m1-preview-browser
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Install WASM tools
        shell: bash
        run: |
          # wasm-bindgen 0.2.108 must resolve compatible walrus (no --locked).
          cargo install --version 0.2.108 wasm-bindgen-cli
          npm install -g binaryen@132.0.0
          wasm-bindgen --version
      - name: Build browser WASM from current Rust
        working-directory: hub-client
        run: npm run build:wasm
      - name: Build trace viewer
        working-directory: trace-viewer
        run: npm run build
      - name: Build current preview SPA
        working-directory: q2-preview-spa
        run: npm run build
      - name: Build native q2 with freshly embedded SPA and WASM
        run: cargo build --bin q2
      - name: Install Chromium
        working-directory: q2-preview-spa
        run: npx playwright install --with-deps chromium
      - name: Run real Chromium nested-include preview tests
        working-directory: q2-preview-spa
        run: npx playwright test e2e/project-transitive-deps.spec.ts --project=chromium --retries=0
      - name: Archive Chromium test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q2-m1-preview-browser-evidence
          path: |
            q2-preview-spa/test-results/
            q2-preview-spa/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
